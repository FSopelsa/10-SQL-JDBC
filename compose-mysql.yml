services:
  mysql:
    image: mysql:8.4
    container_name: school-management-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - school_management_mysql_data:/var/lib/mysql
      - ./sql:/workspace/sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  school_management_mysql_data:
